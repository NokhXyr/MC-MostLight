plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "mostlight-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GeckoLib : uniquement pour les pièces animées (engrenages) ; les lampes statiques restent des modèles précuits
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "GeckoLib"
                url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            }
        }
        filter { includeGroupAndSubgroups("software.bernie.geckolib") }
    }
    // JEI : compatibilité optionnelle (recettes, variantes de finition, fiches d'aide)
    exclusiveContent {
        forRepository {
            maven {
                name = "JEI"
                url = "https://maven.blamejared.com/"
            }
        }
        filter { includeGroup("mezz.jei"); includeGroupAndSubgroups("net.mezzdev") }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // JEI complet en développement (runClient) pour vérifier l'intégration
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        // ./gradlew runShowcase : construit la galerie, vérifie l'éclairage et prend des captures (run/screenshots)
        showcase {
            client()
            systemProperty 'mostlight.showcase', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
        }
        // ./gradlew runShowcaseShaders : même galerie avec Sodium + Iris + un pack de shaders (dossier run-shaders,
        // mods et shaderpack à déposer soi-même dans run-shaders/mods et run-shaders/shaderpacks)
        showcaseShaders {
            client()
            gameDirectory = project.file('run-shaders')
            systemProperty 'mostlight.showcase', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
        }
        // ./gradlew runShowcaseCloseups : un gros plan par modèle (contrôle des modèles, run/screenshots/closeup_*)
        showcaseCloseups {
            client()
            systemProperty 'mostlight.showcase', 'true'
            systemProperty 'mostlight.showcase.closeups', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
        }
        // ./gradlew runShowcaseOpti : même galerie avec une pile de mods d'optimisation (dossier run-opti, voir COMPATIBILITE.md)
        // ./gradlew runArcadia : le mod dans le modpack Arcadia Echoes of Power (dossier run-arcadia, à remplir avec les mods,
        // la config et les shaders d'une instance du pack, sans le jar de MostLight, de GeckoLib et de JEI)
        arcadia {
            client()
            gameDirectory = project.file('run-arcadia')
            jvmArgument '-Xmx10G'
            // Create Numismatics lit ce chemin comme une URI : le chemin Windows du dev la fait planter
            systemProperty 'log4j.configurationFile', 'log4j2.xml'
        }
        // ./gradlew runShowcaseArcadia : les gros plans de toutes les lampes dans ce modpack (run-arcadia/screenshots)
        showcaseArcadia {
            client()
            gameDirectory = project.file('run-arcadia')
            jvmArgument '-Xmx10G'
            // Create Numismatics lit ce chemin comme une URI : le chemin Windows du dev la fait planter
            systemProperty 'log4j.configurationFile', 'log4j2.xml'
            systemProperty 'mostlight.showcase', 'true'
            systemProperty 'mostlight.showcase.closeups', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
        }
        showcaseOpti {
            client()
            gameDirectory = project.file('run-opti')
            systemProperty 'mostlight.showcase', 'true'
            // MOSTLIGHT_SHOWCASE_CLOSEUPS=true : gros plans au lieu de la galerie
            systemProperty 'mostlight.showcase.closeups', System.getenv('MOSTLIGHT_SHOWCASE_CLOSEUPS') ?: 'false'
            programArguments.addAll '--width', '1600', '--height', '900'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runStressServer : test de charge serveur (20 joueurs simulés, ~36 000 lampes), rapport dans run-stress/stress
        stressServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-stress')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'mostlight.stress', 'true'
            jvmArguments.addAll '-Xms4G', '-Xmx6G'
        }
        // même test avec des ampoules en cuivre vanilla à la place des lampes : la référence de comparaison
        stressServerVanilla {
            type = 'gameTestServer'
            gameDirectory = project.file('run-stress-vanilla')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'mostlight.stress', 'true'
            systemProperty 'mostlight.stress.vanilla', 'true'
            jvmArguments.addAll '-Xms4G', '-Xmx6G'
        }
        // ./gradlew runStressClient : même scénario en solo, FPS mesurés (rapport dans run-stress-client/stress)
        stressClient {
            client()
            gameDirectory = project.file('run-stress-client')
            systemProperty 'mostlight.stress.client', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
            jvmArguments.addAll '-Xms4G', '-Xmx6G'
        }
        stressClientVanilla {
            client()
            gameDirectory = project.file('run-stress-client-vanilla')
            systemProperty 'mostlight.stress.client', 'true'
            systemProperty 'mostlight.stress.vanilla', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
            jvmArguments.addAll '-Xms4G', '-Xmx6G'
        }
        // ./gradlew runStressClientArcadia / runStressClientArcadiaVanilla: same scenario inside the Arcadia
        // modpack (run-arcadia), report in run-arcadia/stress
        stressClientArcadia {
            client()
            gameDirectory = project.file('run-arcadia')
            systemProperty 'log4j.configurationFile', 'log4j2.xml'
            systemProperty 'mostlight.stress.client', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
            systemProperty 'mostlight.stress.spark', 'true'
            // local profiling (Java Flight Recorder), analysed with the jfr tool
            jvmArguments.addAll '-Xms8G', '-Xmx16G', '-XX:StartFlightRecording=filename=stress/mostlight.jfr,settings=profile,dumponexit=true'
        }
        stressClientArcadiaVanilla {
            client()
            gameDirectory = project.file('run-arcadia')
            systemProperty 'log4j.configurationFile', 'log4j2.xml'
            systemProperty 'mostlight.stress.client', 'true'
            systemProperty 'mostlight.stress.vanilla', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
            systemProperty 'mostlight.stress.spark', 'true'
            jvmArguments.addAll '-Xms8G', '-Xmx16G', '-XX:StartFlightRecording=filename=stress/vanilla.jfr,settings=profile,dumponexit=true'
        }
        // avec la pile de mods d'optimisation de run-opti (Sodium, ModernFix...)
        stressClientOpti {
            client()
            gameDirectory = project.file('run-opti')
            systemProperty 'mostlight.stress.client', 'true'
            programArguments.addAll '--width', '1600', '--height', '900'
            jvmArguments.addAll '-Xms4G', '-Xmx6G'
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// chaque test de charge serveur repart d'un monde neuf (sinon le terrain se construit sur l'ancien)
['runStressServer': 'run-stress', 'runStressServerVanilla': 'run-stress-vanilla'].each { name, dir ->
    tasks.matching { it.name == name }.configureEach {
        doFirst { delete file("${dir}/world") }
    }
}

// numéro de version du mod (neoforge.mods.toml) tiré de mod_version dans gradle.properties
processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: mod_version
    }
}
